<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waterstanden — Reizenregistratie</title>
  <style>
    body { font-family: system-ui, 'Segoe UI', sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1c2024; }
    h1 { font-size: 1.5rem; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid #e6e7e4; font-variant-numeric: tabular-nums; }
    th { color: #6a7075; font-weight: 500; }
    .klein { color: #6a7075; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Waterstanden</h1>
  <p class="klein">Openbare waterstanden voor de Reizenregistratie, elke nacht bijgewerkt.
    Bronnen: Rijkswaterstaat en Pegelonline (WSV). Ruwe meetwaarden, zonder garantie.</p>
  <p id="bijgewerkt" class="klein"></p>
  <table>
    <thead><tr><th>Peilschaal</th><th>Laatste uur (UTC)</th><th>Stand</th><th>Jaren</th></tr></thead>
    <tbody id="rijen"></tbody>
  </table>
  <script>
    (async () => {
      const idx = await (await fetch('data/index.json', { cache: 'no-store' })).json();
      document.getElementById('bijgewerkt').textContent = 'Bijgewerkt: ' + new Date(idx.bijgewerkt).toLocaleString('nl-NL');
      const rijen = [];
      for (const p of Object.values(idx.peilschalen)) {
        let stand = '';
        if (p.laatste) {
          const jaar = await (await fetch(`data/${p.sleutel}/${p.laatste.slice(0, 4)}.json`)).json();
          stand = jaar[p.laatste] !== undefined ? `${jaar[p.laatste]} cm ${p.nul === 'NAP' ? 'NAP' : ''}` : '';
        }
        rijen.push(`<tr><td>${p.naam}</td><td>${p.laatste || '–'}</td><td>${stand}</td><td>${p.jaren.join(', ')}</td></tr>`);
      }
      document.getElementById('rijen').innerHTML = rijen.join('');
    })();
  </script>
</body>
</html>
