# Haalt elke nacht de waterstanden op en zet ze in docs/data (GitHub Pages).
# Handmatig starten kan via Actions → "Waterstanden bijwerken" → Run workflow.
name: Waterstanden bijwerken

on:
  schedule:
    - cron: '23 3 * * *'      # elke dag 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waterstanden
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Waterstanden ophalen
        run: node scripts/bijwerken.mjs

      - name: Wijzigingen opslaan
        run: |
          git config user.name "waterstanden-bot"
          git config user.email "waterstanden-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Geen nieuwe waterstanden."
          else
            git commit -m "Waterstanden bijgewerkt $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi
